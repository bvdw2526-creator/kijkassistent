# Bouwt de iPhone-app (android-app/ios) op een Mac van GitHub en zet hem in TestFlight.
# Start met de hand: GitHub → Actions → "iOS naar TestFlight" → Run workflow.
#
# Nodig in GitHub → Settings → Secrets and variables → Actions:
#   APPLE_TEAM_ID              Team ID (developer.apple.com → Membership)
#   APPSTORE_API_KEY_ID        Key ID van de App Store Connect API-sleutel (rol Admin)
#   APPSTORE_API_ISSUER_ID     Issuer ID (staat boven de lijst met sleutels)
#   APPSTORE_API_PRIVATE_KEY   De hele inhoud van het .p8-bestand
#
# Ondertekenen gebeurt "in de cloud" bij Apple via de API-sleutel; er staan geen certificaten in de repo.
# Het buildnummer is het nummer van de workflow-run, dus elke upload heeft vanzelf een hoger nummer.

name: iOS naar TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Kies de nieuwste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pakketten installeren en iOS-project bijwerken
        run: |
          npm ci
          npx cap sync ios

      - name: API-sleutel klaarzetten
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_API_KEY_ID.p8"

      - name: Archief bouwen (nog niet ondertekend)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Ondertekenen en uploaden naar App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Sleutel opruimen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
